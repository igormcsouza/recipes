name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by deploy.yml so nothing ships without a green check
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # vitest, 100% coverage gate on lib/ and components/
      - run: npm run test:router
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: uv sync --frozen
        working-directory: infra
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest # 100% coverage gate
        working-directory: infra
      - run: uv export --frozen --no-hashes -q > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
        working-directory: infra
