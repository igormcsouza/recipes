name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy
env:
  AWS_REGION: us-east-1
  STACK: RecipesSite
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci # lint, types, tests with 100% coverage, audit: all must pass before anything ships
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # GitHub OIDC -> AWS, no stored keys
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and invalidate
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out BucketName); DIST=$(out DistributionId)
          aws s3 sync out/_next "s3://$BUCKET/_next" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$BUCKET" --delete --exclude "_next/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
